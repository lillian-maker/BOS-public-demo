    <title>BOS AI品牌经营工作台</title>
    <script type="module">
      const parts = [
        "/BOS-public-demo/assets/index-ChiryLV4.part-01.txt",
        "/BOS-public-demo/assets/index-ChiryLV4.part-02.txt",
        "/BOS-public-demo/assets/index-ChiryLV4.part-03.txt",
        "/BOS-public-demo/assets/index-ChiryLV4.part-04.txt",
        "/BOS-public-demo/assets/index-ChiryLV4.part-05.txt",
      ];
      const expectedSha256 = "915218f930ca686d6bc30477c41bcc90446298d3aaf3b92c2981e23fce26c9a5";
      const responses = await Promise.all(parts.map((part) => fetch(new URL(part, import.meta.url))));
      for (const response of responses) {
        if (!response.ok) throw new Error(`BOS bundle part failed: ${response.status} ${response.url}`);
      }
      const source = (await Promise.all(responses.map((response) => response.text()))).join("");
      const digest = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(source))))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
      if (digest !== expectedSha256) throw new Error("BOS bundle integrity check failed");
      const moduleUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
      try {
        await import(moduleUrl);
      } finally {
        URL.revokeObjectURL(moduleUrl);
      }
    </script>
